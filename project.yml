name: kumusta
options:
  bundleIdPrefix: com.kumusta
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "4UTASKKM73"
    CODE_SIGN_STYLE: Automatic
    # CocoaPods resource scripts need to write their generated file lists.
    ENABLE_USER_SCRIPT_SANDBOXING: false
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    STRING_CATALOG_GENERATE_SYMBOLS: false
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.54.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.82.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    exactVersion: 3.59.3
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk.git
    exactVersion: 18.1.1
targets:
  Kumusta:
    type: application
    platform: iOS
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Kumusta
        UIAppFonts:
          - Fredoka-Bold.ttf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        NSMicrophoneUsageDescription: Kumusta uses your microphone when you practice speaking Tagalog.
        NSSpeechRecognitionUsageDescription: If Kumusta’s speech service is unavailable, Apple speech recognition checks your Tagalog pronunciation instead.
        NSUserTrackingUsageDescription: Kumusta uses your activity to measure ad performance and improve the relevance of our promotions.
        SUPABASE_PROJECT_URL: $(SUPABASE_PROJECT_URL)
        SUPABASE_PUBLISHABLE_KEY: $(SUPABASE_PUBLISHABLE_KEY)
        REVENUECAT_PUBLIC_SDK_KEY: $(REVENUECAT_PUBLIC_SDK_KEY)
        APPSFLYER_DEV_KEY: $(APPSFLYER_DEV_KEY)
        APPSFLYER_APP_ID: $(APPSFLYER_APP_ID)
        TIKTOK_APP_ID: $(TIKTOK_APP_ID)
        TIKTOK_BUSINESS_APP_ID: $(TIKTOK_BUSINESS_APP_ID)
        TIKTOK_APP_ACCESS_TOKEN: $(TIKTOK_APP_ACCESS_TOKEN)
        FacebookAppID: $(FACEBOOK_APP_ID)
        FacebookClientToken: $(FACEBOOK_CLIENT_TOKEN)
        FacebookDisplayName: Kumusta
        # AppsFlyer is the single owner of SKAN conversion values.
        FacebookSKAdNetworkReportEnabled: false
        # Apple sends a copy of every SKAN postback to AppsFlyer.
        NSAdvertisingAttributionReportEndpoint: https://appsflyer-skadnetwork.com/
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - fb$(FACEBOOK_APP_ID)
        KUMUSTA_ENTITLEMENT_ID: $(KUMUSTA_ENTITLEMENT_ID)
        POSTHOG_PROJECT_TOKEN: $(POSTHOG_PROJECT_TOKEN)
        POSTHOG_HOST: $(POSTHOG_HOST)
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: Kumusta
        excludes:
          - "Resources/FirstLessons/**"
      # Folder reference keeps the audio/<hash>.mp3 paths intact.
      - path: Kumusta/Resources/FirstLessons
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kumusta.app
        PRODUCT_NAME: Kumusta
        CURRENT_PROJECT_VERSION: 50
        MARKETING_VERSION: 1.2.3
        OTHER_LDFLAGS: $(inherited) -ObjC -lc++
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - package: PostHog
        product: PostHog
      - package: Facebook
        product: FacebookCore
  KumustaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KumustaTests
    dependencies:
      - target: Kumusta
    configFiles:
      Debug: Config/Tests-Debug.xcconfig
      Release: Config/Tests-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kumusta.tests
        GENERATE_INFOPLIST_FILE: true
  KumustaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KumustaUITests
    dependencies:
      - target: Kumusta
    configFiles:
      Debug: Config/Tests-Debug.xcconfig
      Release: Config/Tests-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kumusta.uitests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Kumusta:
    build:
      targets:
        Kumusta: all
        KumustaTests: [test]
        KumustaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: KumustaTests
        - name: KumustaUITests
    archive:
      config: Release
